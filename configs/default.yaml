seed: 42
data_config: ../data/default.yaml

run:
  name: baseline
  output_dir: runs
  log_interval: 10
  save_every_epochs: 1

wandb:
  enabled: true
  project: brepprediff

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  encoder_type: edge_update_attention
  num_heads: 4
  time_dim: 128
  num_classes: 3
  finetune_head: mlp

diffusion:
  timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_loss_weight: 1.0
  recon_loss_weight: 0.5
  categorical_loss_weight: 0.5
  relation_loss_weight: 0.3

train:
  device: cuda
  epochs: 20
  batch_size: 2
  num_workers: 0
  normalize_per_graph: true
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  distributed_timeout_seconds: 120
  validate_every_epochs: 1
  resume: null
  pretrain_checkpoint: null
  encoder_freeze_mode: none
  encoder_frozen_layers: 2
  class_weights: null
  dice_loss_weight: 0.3

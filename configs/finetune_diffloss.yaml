seed: 42
run:
  name: finetune_diffloss
  output_dir: runs
  log_interval: 10
  save_every_epochs: 1

data:
  root: data
  steps_dir: steps
  segs_dir: segs
  cache_dir: data/cache/features/finetune
  cache_dirs:
    train: data/cache/features/finetune_split/train
    val: data/cache/features/finetune_split/val
  cache_only: true
  train_split: data/abc_splits/finetune_train.txt
  val_split: data/abc_splits/finetune_val.txt
  test_split: null
  step_extensions: [".step", ".stp", ".STEP", ".STP"]
  labels_required: true
  strict_label_count: true
  overwrite_cache: false
  normalize_per_graph: true
  num_workers: 8
  cache_num_workers: 0
  invalid_log: null

brep:
  uv_grid_size: 4
  occ_precision: 1.0e-6
  smooth_angle_degrees: 5.0
  surface_type_vocab: 32
  edge_type_vocab: 32
  relation_type_vocab: 4

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  time_dim: 128
  num_classes: 3
  finetune_head: diffusion

# Per-face Diffusion Loss. The clean target is 2 * one_hot(label) - 1.
label_diffusion:
  target_encoding: bipolar_one_hot
  train_timesteps: 1000
  noise_schedule: cosine
  prediction_type: epsilon
  head_width: 128
  head_depth: 3
  head_dropout: 0.0
  noise_samples_per_token: 4
  sampling_method: ddim
  sampling_steps: 25
  ddim_eta: 0.0
  sampling_temperature: 1.0
  clip_x_start: true
  inference_samples: 1
  score_temperature: 1.0
  seed: 42

# Retained for compatibility with diffusion pretraining checkpoints.
diffusion:
  timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_loss_weight: 1.0
  recon_loss_weight: 0.5
  categorical_loss_weight: 0.5
  relation_loss_weight: 0.3
  coarse_label_loss_weight: 0.2

train:
  stage: finetune
  device: cuda
  epochs: 30
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  validate_every_epochs: 1
  # best.pt is selected by validation Macro-F1 (higher is better).
  resume: null
  # Supply a concrete pretraining checkpoint at launch, for example:
  # --override train.pretrain_checkpoint=runs/pretrain/<run>/checkpoints/last.pt
  pretrain_checkpoint: runs/pretrain/20260709-143638_baseline/checkpoints/last.pt
  pretrained_encoder: null
  # Sqrt inverse-frequency weights for the current 84.9% / 3.3% / 11.8% split.
  class_weights: [0.34, 1.74, 0.92]
  dice_loss_weight: 0.3
  ignore_index: -100

labels:
  names: ["NonTransition", "VBF", "EBF"]
  value_offset: 0
  raw_to_class_map:
    4: 2
    6: 1
  default_class: 0
  coarse_soft_targets:
    0: [0.90, 0.05, 0.05]
    1: [0.05, 0.80, 0.15]
    2: [0.05, 0.15, 0.80]

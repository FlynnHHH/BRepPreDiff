seed: 42
data_config: ../data/fusion360seg.yaml

run:
  name: fusion360seg_mlp_rotate_mix
  output_dir: runs
  log_interval: 10
  save_every_epochs: 10
  show_progress: false

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  num_classes: 8
  finetune_head: mlp

train:
  device: cuda:4
  require_cuda: true
  epochs: 100
  batch_size: 256
  num_workers: 8
  normalize_per_graph: true
  rotation_augmentation_probability: 0.5
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  distributed_timeout_seconds: 120
  validate_every_epochs: 1
  selection_metric: acc
  resume: null
  pretrain_checkpoint: runs/pretrain/20260720-212145_pretrain_resume_20260720_205223/checkpoints/last.pt
  encoder_freeze_mode: none
  encoder_frozen_layers: 2
  class_weights: null
  dice_loss_weight: 0.3

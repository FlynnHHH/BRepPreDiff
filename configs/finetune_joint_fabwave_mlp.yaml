seed: 42
data_config: ../data/fabwave.yaml

run:
  name: joint_fabwave_mlp
  output_dir: runs
  log_interval: 10
  save_every_epochs: 10
  show_progress: false

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  num_classes: 44
  finetune_head: mlp
  graph_pooling: mean_max

train:
  device: cuda
  require_cuda: true
  epochs: 100
  batch_size: 256
  num_workers: 8
  normalize_per_graph: true
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  distributed_timeout_seconds: 120
  validate_every_epochs: 1
  selection_metric: acc
  resume: null
  pretrain_checkpoint: null
  encoder_freeze_mode: none
  encoder_frozen_layers: 2
  class_weights: null

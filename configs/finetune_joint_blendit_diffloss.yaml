seed: 42
data_config: ../data/finetune.yaml

run:
  name: joint_blendit_diffloss_best
  output_dir: runs
  log_interval: 10
  save_every_epochs: 10
  show_progress: false

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  num_classes: 3
  finetune_head: diffusion

label_diffusion:
  target_encoding: bipolar_one_hot
  train_timesteps: 1000
  noise_schedule: cosine
  prediction_type: x_start
  x_start_loss_weight: 1.0
  epsilon_loss_weight: 0.0
  head_width: 128
  head_depth: 3
  head_dropout: 0.0
  noise_samples_per_token: 4
  sampling_method: ddim
  sampling_steps: 1
  ddim_eta: 0.0
  sampling_temperature: 0.75
  clip_x_start: true
  inference_samples: 1
  score_temperature: 1.0
  class_score_bias: [0.75, 0.0, 0.0]
  seed: 42

train:
  device: cuda
  require_cuda: true
  epochs: 100
  batch_size: 256
  num_workers: 8
  normalize_per_graph: true
  lr: 3.0e-4
  encoder_lr: 3.0e-4
  head_lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  distributed_timeout_seconds: 120
  validate_every_epochs: 1
  selection_metric: acc
  resume: null
  pretrain_checkpoint: runs/pretrain/20260723-213828_joint_all_splits_no_coarse/checkpoints/last.pt
  encoder_freeze_mode: none
  encoder_frozen_layers: 2
  class_weights: [0.67, 1.37, 0.96]
  dice_loss_weight: 0.3

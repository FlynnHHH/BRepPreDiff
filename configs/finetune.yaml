seed: 42
data_config: ../data/finetune.yaml

run:
  name: finetune
  output_dir: runs
  log_interval: 10
  save_every_epochs: 1

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  num_classes: 3
  finetune_head: mlp

train:
  device: cuda
  epochs: 100
  batch_size: 512
  num_workers: 16
  normalize_per_graph: true
  lr: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  distributed_timeout_seconds: 120
  validate_every_epochs: 1
  # best.pt is selected by validation accuracy (higher is better).
  resume: null
  # Override this when initializing finetune from a pretrain checkpoint:
  # --override train.pretrain_checkpoint=runs/pretrain/<run>/checkpoints/last.pt
  pretrain_checkpoint: null
  encoder_freeze_mode: none
  encoder_frozen_layers: 2
  class_weights: null
  dice_loss_weight: 0.3

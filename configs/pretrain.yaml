seed: 42
# Default encoder pretraining uses the seven-source transductive corpus and
# the OCC-grid-v2 schema (711 face features / 63 edge features).
data_config: ../data/pretrain_joint_fusion_gallery_filtered_fabwave_all_splits.yaml

run:
  name: pretrain
  output_dir: runs
  log_interval: 10
  save_every_epochs: 5

wandb:
  enabled: true
  project: blendit

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  encoder_type: edge_update_attention
  num_heads: 4
  time_dim: 128

diffusion:
  timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_loss_weight: 1.0
  recon_loss_weight: 0.5
  categorical_loss_weight: 0.5
  relation_loss_weight: 0.3

train:
  device: cuda
  epochs: 150
  # Per-rank batch size for the default four-GPU launch (global batch 256).
  batch_size: 64
  num_workers: 16
  normalize_per_graph: true
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  distributed_timeout_seconds: 120
  validate_every_epochs: 1
  resume: null

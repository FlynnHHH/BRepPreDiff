seed: 42
data_config: ../data/pretrain.yaml

run:
  name: pretrain
  output_dir: runs
  log_interval: 10
  save_every_epochs: 5

model:
  hidden_dim: 128
  num_layers: 4
  dropout: 0.1
  time_dim: 128
  num_classes: 3
  use_coarse_label_head: true

diffusion:
  timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_loss_weight: 1.0
  recon_loss_weight: 0.5
  categorical_loss_weight: 0.5
  relation_loss_weight: 0.3
  coarse_label_loss_weight: 0.2

train:
  device: cuda
  epochs: 150
  batch_size: 512
  num_workers: 16
  normalize_per_graph: true
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  distributed_timeout_seconds: 120
  validate_every_epochs: 1
  resume: null

labels:
  # Used only for coarse auxiliary supervision during pretraining.
  coarse_soft_targets:
    0: [0.90, 0.05, 0.05]
    1: [0.05, 0.80, 0.15]
    2: [0.05, 0.15, 0.80]

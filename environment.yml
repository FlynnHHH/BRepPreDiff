name: blendit

channels:
  - pytorch
  - defaults

# Reproduces the locally verified blendit environment. pythonocc-core is not
# installed in that environment; add it separately when STEP extraction or PLY
# export is required.
dependencies:
  - python=3.9.23
  - pip=26.0.1
  - setuptools=80.9.0
  - wheel=0.45.1
  - pytorch=1.12.1
  - torchvision=0.13.1
  - torchaudio=0.12.1
  - cudatoolkit=10.2.89
  - pytest=8.4.2
  - pip:
      - numpy==1.24.0
      - PyYAML==6.0.3
      - tqdm==4.68.4

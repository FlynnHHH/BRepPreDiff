task: cls

data:
  steps_dir: /data/hhfeng/TMCAD
  labels_dir: /data/hhfeng/TMCAD
  cache_dir: data/cache/features/tmcad
  prepare_on_start: false
  # Clean splits omit the 11 source STEP files that OCC cannot parse safely.
  train_split: data/splits/tmcad_train.txt
  val_split: data/splits/tmcad_val.txt
  test_split: data/splits/tmcad_test.txt
  step_extensions: [".step", ".stp", ".STEP", ".STP"]
  labels_required: true
  strict_label_count: true
  overwrite_cache: false
  cache_num_workers: 16
  invalid_log: data/cache/features/tmcad_invalid.jsonl

brep:
  # Matches the available Blendit pretraining checkpoint.
  uv_grid_size: 10
  occ_precision: 1.0e-6
  smooth_angle_degrees: 5.0
  surface_type_vocab: 32
  edge_type_vocab: 32
  relation_type_vocab: 4

labels:
  encoding: one_hot
  num_classes: 10
  ignore_index: -100
  include_transition_binary: false
  names:
    - bearing
    - bolt
    - bracket
    - coupling
    - flange
    - gear
    - nut
    - pulley
    - screw
    - shaft

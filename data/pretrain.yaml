data:
  steps_dir: /data/hhfeng/blendit/pretrain/step
  segs_dir: /data/hhfeng/blendit/pretrain/seg
  cache_dir: /data/hhfeng/blendit/cache/features/pretrain
  prepare_on_start: false
  train_split: data/splits/pretrain_train.txt
  val_split: null
  test_split: null
  step_extensions: [".step", ".stp", ".STEP", ".STP"]
  labels_required: true
  strict_label_count: true
  overwrite_cache: false
  cache_num_workers: 16
  invalid_log: null

brep:
  uv_grid_size: 10
  occ_precision: 1.0e-6
  smooth_angle_degrees: 5.0
  surface_type_vocab: 32
  edge_type_vocab: 32
  relation_type_vocab: 4

labels:
  value_offset: 0
  raw_to_class_map:
    4: 2
    6: 1
  default_class: 0
  ignore_index: -100

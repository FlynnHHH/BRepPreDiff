data:
  steps_dir: /data/hhfeng/fusion360ass/j1.0.0/joint
  # Deliberately isolated from co-located assembly/joint JSON metadata.
  segs_dir: data/no_labels/fusion360ass_j1_0_0
  cache_dir: data/cache/features/fusion360ass_j1_0_0_unlabeled
  prepare_on_start: false
  train_split: data/splits/fusion360ass_j1_0_0_train_clean.txt
  val_split: data/splits/fusion360ass_j1_0_0_val_clean.txt
  test_split: data/splits/fusion360ass_j1_0_0_test_clean.txt
  split_seed: 42
  split_ratios: {train: 0.8, val: 0.1, test: 0.1}
  step_extensions: [".step", ".stp", ".STEP", ".STP"]
  labels_required: false
  strict_label_count: false
  overwrite_cache: false
  cache_num_workers: 16
  invalid_log: data/cache/features/fusion360ass_j1_0_0_unlabeled_invalid.jsonl

brep:
  uv_grid_size: 10
  occ_precision: 1.0e-6
  smooth_angle_degrees: 5.0
  surface_type_vocab: 32
  edge_type_vocab: 32
  relation_type_vocab: 4

labels:
  ignore_index: -100

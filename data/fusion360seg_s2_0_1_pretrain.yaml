data:
  steps_dir: /data/hhfeng/fusion360seg/s2.0.1/breps/step
  segs_dir: /data/hhfeng/fusion360seg/s2.0.1/breps/seg
  cache_dir: /data/hhfeng/blendit/cache/features/fusion360seg_s2_0_1
  prepare_on_start: false
  train_split: data/splits/fusion360seg_s2_0_1_train_clean.txt
  val_split: data/splits/fusion360seg_s2_0_1_val_clean.txt
  test_split: data/splits/fusion360seg_s2_0_1_test_clean.txt
  step_extensions: [".step", ".stp", ".STEP", ".STP"]
  labels_required: false
  strict_label_count: false
  overwrite_cache: false
  cache_num_workers: 16
  invalid_log: /data/hhfeng/blendit/cache/features/fusion360seg_s2_0_1_invalid.jsonl

brep:
  uv_grid_size: 10
  occ_precision: 1.0e-6
  smooth_angle_degrees: 5.0
  surface_type_vocab: 32
  edge_type_vocab: 32
  relation_type_vocab: 4

labels:
  ignore_index: -100


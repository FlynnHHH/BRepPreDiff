[project]
name = "blendit"
version = "0.1.0"
description = "B-Rep diffusion pretraining and face segmentation for blend face recognition."
readme = "README.md"
requires-python = ">=3.9,<3.13"
keywords = ["b-rep", "cad", "diffusion", "face-segmentation", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=1.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
blendit-cache = "blendit.data.load_data:cache_main"
blendit-prepare-data = "blendit.data.load_data:main"
blendit-filter-split = "blendit.data.load_data:filter_split_main"
blendit-scan-cache = "blendit.data.load_data:scan_cache_main"
blendit-infer-visual = "blendit.inference.finetune_visualize:main"
blendit-infer-seg = "blendit.inference.step_to_seg:main"
blendit-pretrain = "blendit.training.pretrain:main"
blendit-finetune = "blendit.training.finetune:main"
blendit-smoke = "blendit.training.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blendit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

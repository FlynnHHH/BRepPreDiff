[project]
name = "blendit"
version = "0.1.0"
description = "B-Rep diffusion pretraining and face segmentation for blend face recognition."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
blendit-cache = "blendit.data.dataset:cache_main"
blendit-filter-split = "blendit.data.filter_split:main"
blendit-pretrain = "blendit.training.pretrain:main"
blendit-finetune = "blendit.training.finetune:main"
blendit-smoke = "blendit.training.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blendit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
